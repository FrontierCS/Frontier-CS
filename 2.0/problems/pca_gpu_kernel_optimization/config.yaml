tag: systems
runtime:
  language: python
  timeout_seconds: 10800
  environment: "GPU PCA kernel optimization. The agent patches the pcalib package; the judge offloads timing to a Modal GPU, comparing the patched pca against a frozen naive baseline on hidden (N, D, k) workloads with an orthonormal-components + captured-variance quality gate."
  apt_packages:
    - bash
    - ca-certificates
    - git
    - python3
    - python3-pip
  judge_apt_packages:
    - bash
    - ca-certificates
    - git
    - python3
    - python3-pip
  judge_pip_packages:
    - modal
  docker:
    # Experimental local images. Build with docker/build_images.sh before a local
    # Harbor trial. Both are light (ubuntu + modal + git); torch/triton/flashlib
    # run on the Modal GPU image defined in flash_gpu.py. The agent image bakes
    # /app/pcalib (git) + /opt/pca_ref + /opt/flash_gpu.py; the judge image
    # additionally bakes /opt/pcalib-clean.
    image: frontiercs/pca-gpu-kernel-optimization-agent:experimental-v0.2.0
    judge_image: frontiercs/pca-gpu-kernel-optimization-judge:experimental-v0.2.0
environment:
  cpus: 4
  memory_mb: 8192
  storage_mb: 16384
  build_timeout_seconds: 3600
evaluation:
  gpu: "H100"
  cuda_image: "nvidia/cuda:12.4.1-devel-ubuntu22.04"
  pip: ["torch", "numpy"]
  app_name: "pca-kernel-opt-eval"
  modal_timeout_seconds: 1800
  warmup_iters: 2
  timed_iters: 7
  captured_tolerance: 0.02
  ortho_tolerance: 0.02
  speedup_target: 4.0
  base_seed: 20260701
  agent_workload_count: 3
  expose_per_workload_metrics: false
  workloads:
    - {id: w0, N: 500000,  D: 128, k: 16}
    - {id: w1, N: 1000000, D: 64,  k: 8}
    - {id: w2, N: 200000,  D: 512, k: 32}
    - {id: w3, N: 2000000, D: 32,  k: 8}
    - {id: w4, N: 300000,  D: 256, k: 16}
    - {id: w5, N: 800000,  D: 128, k: 32}
submission:
  kind: file
  path: /app/solution.patch

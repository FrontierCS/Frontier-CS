tag: systems
runtime:
  language: rust
  timeout_seconds: 10800
  environment: "Rust project; hidden disk ANN benchmark; Python/NumPy judge"
  apt_packages:
    - build-essential
    - cargo
    - git
    - rustc
  judge_apt_packages:
    - build-essential
    - cargo
    - rustc
    - python3-pip
    - python3-numpy
  judge_pip_packages:
    - faiss-cpu
  docker:
    image: ubuntu:24.04
environment:
  # If these resource limits change, also update the resource budget text in
  # readme and harbor/app/README.md so agents can design parallel algorithms
  # for the actual CPU and memory budget.
  cpus: 8
  memory_mb: 8192
  storage_mb: 8192
  build_timeout_seconds: 3600
evaluation:
  # The judge drives the search service with this many concurrent workers.
  # Keep this aligned with the CPU budget unless the task is intentionally
  # changed into a higher-concurrency service benchmark.
  query_concurrency: 8
  queries_per_worker: 64
harbor:
  # These values are rendered into the judge sidecar's docker-compose
  # environment for local/server Harbor trials generated from this repo.
  # This default setup expects query/truth/baseline files for recall scoring.
  judge_env:
    FRONTIER_VECTOR_DB_N: "100000000"
    FRONTIER_VECTOR_DB_Q: "10000"
    FRONTIER_VECTOR_DB_VECTOR_DTYPE: uint8
    FRONTIER_VECTOR_DB_QUERY_DTYPE: uint8
    FRONTIER_VECTOR_DB_SMOKE_ONLY: "0"
    FRONTIER_VECTOR_DB_CACHE: /frontier-work/cache
    TMPDIR: /frontier-work/tmp
    FRONTIER_VECTOR_DB_VECTOR_PATH: /frontier-data/sift/index_100M/100M.u8bin
    FRONTIER_VECTOR_DB_INDEX_PATH: /frontier-data/sift/index_100M/100M_disk.index
    FRONTIER_VECTOR_DB_PQ_PIVOTS_PATH: /frontier-data/sift/index_100M/100M_pq_pivots.bin
    FRONTIER_VECTOR_DB_PQ_COMPRESSED_PATH: /frontier-data/sift/index_100M/100M_pq_compressed.bin
    FRONTIER_VECTOR_DB_QUERY_PATH: /frontier-data/sift/index_100M/query.bin
    FRONTIER_VECTOR_DB_TRUTH_PATH: /frontier-data/sift/index_100M/truth.bin
    FRONTIER_VECTOR_DB_BASELINE_PATH: /frontier-data/sift/index_100M/baseline.json
  judge_mounts:
    - source_env: FRONTIER_VECTOR_DB_SIFT_DIR
      source_default: ${HOME}/nvme7/sift/index_100M
      target: /frontier-data/sift/index_100M
      read_only: true
    - source_env: FRONTIER_VECTOR_DB_WORK_DIR
      source_default: ${HOME}/nvme3/frontier_vector_db_ann_disk_work
      target: /frontier-work
      read_only: false
submission:
  kind: directory
  path: /app
  exclude:
    - target
    - .git
    - .frontier-cs

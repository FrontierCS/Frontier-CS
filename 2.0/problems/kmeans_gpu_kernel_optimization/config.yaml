tag: systems
runtime:
  language: python
  timeout_seconds: 10800
  environment: "GPU K-Means kernel optimization. The agent patches the kmeanslib package; the judge offloads timing to a Modal GPU, comparing the patched kmeans against a frozen naive baseline on hidden (N, D, K) workloads with an inertia (clustering-quality) gate."
  apt_packages:
    - bash
    - ca-certificates
    - git
    - python3
    - python3-pip
  judge_apt_packages:
    - bash
    - ca-certificates
    - git
    - python3
    - python3-pip
  judge_pip_packages:
    - modal
  docker:
    # Experimental local images. Build with docker/build_images.sh before a local
    # Harbor trial. Both are light (ubuntu + modal + git); torch/triton/flashlib
    # run on the Modal GPU image defined in flash_gpu.py. The agent image bakes
    # /app/kmeanslib (git) + /opt/kmeans_ref + /opt/flash_gpu.py; the judge image
    # additionally bakes /opt/kmeanslib-clean.
    image: frontiercs/kmeans-gpu-kernel-optimization-agent:experimental-v0.2.0
    judge_image: frontiercs/kmeans-gpu-kernel-optimization-judge:experimental-v0.2.0
environment:
  cpus: 4
  memory_mb: 8192
  storage_mb: 16384
  build_timeout_seconds: 3600
evaluation:
  # --- primitive wiring (consumed by the generic evaluator + flash_gpu) ---
  primitive: kmeans
  pkg: kmeanslib
  ref_module: refkmeans
  clean_source: /opt/kmeanslib-clean
  baseline_source: /opt/kmeans_ref
  # --- Modal GPU ---
  gpu: "H100"                                        # Modal GPU spec (H100 / A100 / L40S)
  cuda_image: "nvidia/cuda:12.4.1-devel-ubuntu22.04"
  pip: ["torch", "numpy"]
  app_name: "kmeans-kernel-opt-eval"
  modal_timeout_seconds: 1800
  # --- timing + quality gate ---
  warmup_iters: 2
  timed_iters: 1                 # one timed run per workload -- max_iters back to 8-12 makes each call substantial (low relative timing noise), so no repeat-and-average
  inertia_tolerance: 0.10        # gate B (centroids): loose -- two correct bf16 solutions diverge to different local optima over many iterations (w0 D=32,12-iter ref drifts ~6.5% from baseline)
  label_tolerance: 0.02          # gate A (labels): only applied when max_iters==1 (labels = argmin to init); skipped here since Lloyd runs multiple steps
  speedup_target: 7.1            # H100 recal (bf16, multi-iter, planted, centroid gate 0.10): flashlib reference geomean 7.12x over the bf16 baseline (3.4/3.7/10.5/4.6/16.8/12.9x), all 6 pass
  base_seed: 20260701
  agent_workload_count: 6            # agent's submission feedback covers ALL graded workloads (no blind pass-3/fail-6 cliff); params are agent-visible anyway
  expose_per_workload_metrics: true  # show per-workload pass/fail so the agent can fix the specific workload it regresses on
  # Multi-iteration Lloyd (original max_iters). Data is bf16 (locked in the worker's
  # gen) so precision is not a lever; planted well-separated blobs so a wrong
  # (e.g. subsampled-dim) assignment compounds over iterations into bad centroids
  # and fails the inertia gate.
  workloads:
    - {id: w0, N: 100000,  D: 32,  K: 128,  max_iters: 12}
    - {id: w1, N: 200000,  D: 64,  K: 256,  max_iters: 10}
    - {id: w2, N: 500000,  D: 128, K: 256,  max_iters: 10}
    - {id: w3, N: 200000,  D: 512, K: 256,  max_iters: 8}
    - {id: w4, N: 1000000, D: 64,  K: 512,  max_iters: 8}
    - {id: w5, N: 300000,  D: 128, K: 1024, max_iters: 8}
submission:
  kind: file
  path: /app/solution.patch

tag: systems
runtime:
  language: python
  timeout_seconds: 10800
  environment: "GPU K-Means kernel optimization. The agent patches the kmeanslib package; the judge offloads timing to a Modal GPU, comparing the patched kmeans against a frozen naive baseline on hidden (N, D, K) workloads with an inertia (clustering-quality) gate."
  apt_packages:
    - bash
    - ca-certificates
    - git
    - python3
    - python3-pip
  judge_apt_packages:
    - bash
    - ca-certificates
    - git
    - python3
    - python3-pip
  judge_pip_packages:
    - modal
  docker:
    # Experimental local images. Build with docker/build_images.sh before a local
    # Harbor trial. Both are light (ubuntu + modal + git); torch/triton/flashlib
    # run on the Modal GPU image defined in flash_gpu.py. The agent image bakes
    # /app/kmeanslib (git) + /opt/kmeans_ref + /opt/flash_gpu.py; the judge image
    # additionally bakes /opt/kmeanslib-clean.
    image: frontiercs/kmeans-gpu-kernel-optimization-agent:experimental-v0.2.0
    judge_image: frontiercs/kmeans-gpu-kernel-optimization-judge:experimental-v0.2.0
environment:
  cpus: 4
  memory_mb: 8192
  storage_mb: 16384
  build_timeout_seconds: 3600
evaluation:
  # --- primitive wiring (consumed by the generic evaluator + flash_gpu) ---
  primitive: kmeans
  pkg: kmeanslib
  ref_module: refkmeans
  clean_source: /opt/kmeanslib-clean
  baseline_source: /opt/kmeans_ref
  # --- Modal GPU ---
  gpu: "H100"                                        # Modal GPU spec (H100 / A100 / L40S)
  cuda_image: "nvidia/cuda:12.4.1-devel-ubuntu22.04"
  pip: ["torch", "numpy"]
  app_name: "kmeans-kernel-opt-eval"
  modal_timeout_seconds: 1800
  # --- timing + quality gate ---
  warmup_iters: 2
  timed_iters: 10                # run each workload 10 times (max_iters=1 makes one call tiny) ...
  aggregate: mean                # ... and AVERAGE the 10 per-run speedups (not median)
  inertia_tolerance: 0.02        # agent inertia must be <= (1+tol) x baseline on every iteration
  speedup_target: 5.0            # H100 recalibration (bf16, max_iters=1): flashlib reference geomean 4.97x over the bf16 naive baseline (per-workload 5.0/2.6/10.9/1.8/12.6/4.7x); inertia drift <0.0012%
  base_seed: 20260701
  agent_workload_count: 6            # agent's submission feedback covers ALL graded workloads (no blind pass-3/fail-6 cliff); params are agent-visible anyway
  expose_per_workload_metrics: true  # show per-workload pass/fail so the agent can fix the specific workload it regresses on
  # max_iters=1 for ALL workloads: time a single Lloyd iteration (1 assign + 1
  # update) so the score isolates per-iteration kernel efficiency. Data is bf16
  # (locked in the worker's gen) -> precision is not a lever, only the kernel is.
  workloads:
    - {id: w0, N: 100000,  D: 32,  K: 128,  max_iters: 1}
    - {id: w1, N: 200000,  D: 64,  K: 256,  max_iters: 1}
    - {id: w2, N: 500000,  D: 128, K: 256,  max_iters: 1}
    - {id: w3, N: 200000,  D: 512, K: 256,  max_iters: 1}
    - {id: w4, N: 1000000, D: 64,  K: 512,  max_iters: 1}
    - {id: w5, N: 300000,  D: 128, K: 1024, max_iters: 1}
submission:
  kind: file
  path: /app/solution.patch

tag: systems
runtime:
  language: python
  timeout_seconds: 10800
  environment: "GPU K-Means kernel optimization. The agent patches the kmeanslib package; the judge offloads timing to a Modal GPU, comparing the patched kmeans against a frozen naive baseline on hidden (N, D, K) workloads with an inertia (clustering-quality) gate."
  apt_packages:
    - bash
    - ca-certificates
    - git
    - python3
    - python3-pip
  judge_apt_packages:
    - bash
    - ca-certificates
    - git
    - python3
    - python3-pip
  judge_pip_packages:
    - modal
  docker:
    # Experimental local images. Build with docker/build_images.sh before a local
    # Harbor trial. Both are light (ubuntu + modal + git); torch/triton/flashlib
    # run on the Modal GPU image defined in flash_gpu.py. The agent image bakes
    # /app/kmeanslib (git) + /opt/kmeans_ref + /opt/flash_gpu.py; the judge image
    # additionally bakes /opt/kmeanslib-clean.
    image: frontiercs/kmeans-gpu-kernel-optimization-agent:experimental-v0.2.0
    judge_image: frontiercs/kmeans-gpu-kernel-optimization-judge:experimental-v0.2.0
environment:
  cpus: 4
  memory_mb: 8192
  storage_mb: 16384
  build_timeout_seconds: 3600
evaluation:
  # --- primitive wiring (consumed by the generic evaluator + flash_gpu) ---
  primitive: kmeans
  pkg: kmeanslib
  ref_module: refkmeans
  clean_source: /opt/kmeanslib-clean
  baseline_source: /opt/kmeans_ref
  # --- Modal GPU ---
  gpu: "H100"                                        # Modal GPU spec (H100 / A100 / L40S)
  cuda_image: "nvidia/cuda:12.4.1-devel-ubuntu22.04"
  pip: ["torch", "numpy"]
  app_name: "kmeans-kernel-opt-eval"
  modal_timeout_seconds: 1800
  # --- timing + quality gate ---
  warmup_iters: 2
  timed_iters: 1                 # one timed run per workload; the timed unit is the judge-owned loop of max_iters `step` calls
  inertia_tolerance: 0.05        # centroid gate: agent final centroids nearest-inertia <= (1+tol) x baseline. Worst flashlib-ref bf16 drift is +1.47% (w3, D=512) at max_iters=2, so 5% leaves margin while still rejecting bad centroids.
  speedup_target: 5.0            # calibrated (H100, step contract, max_iters=2): flashlib reference geomean 4.95x over the frozen bf16 baseline (per-wl 2.1/2.4/6.7/3.5/13.2/9.3x), all 6 passing the gate.
  base_seed: 20260701
  agent_workload_count: 6            # agent's submission feedback covers ALL graded workloads (no blind pass-3/fail-6 cliff); params are agent-visible anyway
  expose_per_workload_metrics: true  # show per-workload pass/fail so the agent can fix the specific workload it regresses on
  # The agent provides one Lloyd `step(x, centroids)`; the JUDGE owns the loop and
  # calls it exactly max_iters times (=2). The agent cannot skip iterations, change
  # the data/init, or fake the count -- it can only make a single step faster
  # (e.g. fuse assign+update). Data is bf16 (locked in gen) so precision is not a
  # lever; planted well-separated blobs. max_iters=2 (not 1) is enough to be a real
  # loop while too few for a converged step to become a redundant no-op.
  workloads:
    - {id: w0, N: 100000,  D: 32,  K: 128,  max_iters: 2}
    - {id: w1, N: 200000,  D: 64,  K: 256,  max_iters: 2}
    - {id: w2, N: 500000,  D: 128, K: 256,  max_iters: 2}
    - {id: w3, N: 200000,  D: 512, K: 256,  max_iters: 2}
    - {id: w4, N: 1000000, D: 64,  K: 512,  max_iters: 2}
    - {id: w5, N: 300000,  D: 128, K: 1024, max_iters: 2}
submission:
  kind: file
  path: /app/solution.patch

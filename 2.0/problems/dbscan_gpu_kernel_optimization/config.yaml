tag: systems
runtime:
  language: python
  timeout_seconds: 10800
  environment: "GPU DBSCAN kernel optimization. The agent patches the dbscanlib package; the judge offloads timing to a Modal GPU, comparing the patched dbscan against a frozen naive baseline on hidden low-dimensional workloads with an ARI (clustering-agreement) gate."
  apt_packages: [bash, ca-certificates, git, python3, python3-pip]
  judge_apt_packages: [bash, ca-certificates, git, python3, python3-pip]
  judge_pip_packages: [modal]
  docker:
    image: frontiercs/dbscan-gpu-kernel-optimization-agent:experimental-v0.3.0
    judge_image: frontiercs/dbscan-gpu-kernel-optimization-judge:experimental-v0.3.0
environment:
  cpus: 4
  memory_mb: 8192
  storage_mb: 16384
  build_timeout_seconds: 3600
evaluation:
  gpu: "H100"
  cuda_image: "nvidia/cuda:12.4.1-devel-ubuntu22.04"
  pip: ["torch", "numpy"]
  app_name: "dbscan-kernel-opt-eval"
  modal_timeout_seconds: 2400
  warmup_iters: 2
  timed_iters: 3            # the O(N^2) naive baseline is seconds/call at these N; keep the timed budget bounded (median of 3)
  ari_threshold: 0.99            # agent clustering must match the baseline exact DBSCAN (Adjusted Rand Index) every iteration. On the non-separable concentric-ring data a centroid/partition approximation (k-means) scores ARI <= ~0.1 -> fails; only exact eps-connectivity passes. Exact reference measures ARI ~1.0.
  speedup_target: 57.0           # score cap = 2x the flashlib reference geomean on the bf16-locked blob workloads (28.6x on H100, ARI=1.0 all 4). Points carry only bf16 precision so no solution wins by computing the eps-graph distances in a lower dtype; well-separated blobs mean bf16 never flips an eps-neighbour (ARI stays exactly 1.0).
  base_seed: 20260701
  agent_workload_count: 4            # all 4 flashlib graded workloads (feedback covers every graded shape)
  expose_per_workload_metrics: true  # show per-workload pass/fail so the agent can fix the specific workload it regresses on
  # N in the 100k-170k band: the O(N^2) matmul baseline is seconds/call (grid kernel
  # wins 6-20x) but bounded for timed_iters; below ~100k the tensor-core matmul baseline
  # is faster than the grid kernel's fixed overhead. Vary N + density so agents can't
  # special-case. (H100 crossover sweep: 100k->6.0x, 150k->14.1x, 200k->27.0x.)
  workloads:
    # flashlib's own DBSCAN benchmark shapes (benchmarks/vs_cuml/dbscan.py): make_blobs
    # data, cluster_std=1.0, no noise. D>=8 -> flashlib's benchmarked brute-force
    # (flash_knn) path. The generator is judge-only (hidden from the agent).
    - {id: w0, N: 20000, D: 8,  eps: 1.5, min_samples: 5, n_centers: 4}
    - {id: w1, N: 20000, D: 32, eps: 6.0, min_samples: 5, n_centers: 6}
    - {id: w2, N: 20000, D: 64, eps: 8.0, min_samples: 5, n_centers: 10}
    - {id: w3, N: 50000, D: 16, eps: 3.5, min_samples: 5, n_centers: 8}
submission:
  kind: file
  path: /app/solution.patch

tag: systems
runtime:
  language: python
  timeout_seconds: 10800
  environment: "GPU DBSCAN kernel optimization. The agent patches the dbscanlib package; the judge offloads timing to a Modal GPU, comparing the patched dbscan against a frozen naive baseline on hidden low-dimensional workloads with an ARI (clustering-agreement) gate."
  apt_packages: [bash, ca-certificates, git, python3, python3-pip]
  judge_apt_packages: [bash, ca-certificates, git, python3, python3-pip]
  judge_pip_packages: [modal]
  docker:
    image: frontiercs/dbscan-gpu-kernel-optimization-agent:experimental-v0.2.0
    judge_image: frontiercs/dbscan-gpu-kernel-optimization-judge:experimental-v0.2.0
environment:
  cpus: 4
  memory_mb: 8192
  storage_mb: 16384
  build_timeout_seconds: 3600
evaluation:
  gpu: "H100"
  cuda_image: "nvidia/cuda:12.4.1-devel-ubuntu22.04"
  pip: ["torch", "numpy"]
  app_name: "dbscan-kernel-opt-eval"
  modal_timeout_seconds: 2400
  warmup_iters: 2
  timed_iters: 3            # the O(N^2) naive baseline is seconds/call at these N; keep the timed budget bounded (median of 3)
  ari_threshold: 0.99            # agent clustering must agree with the baseline (Adjusted Rand Index) on every iteration; the grid reference measured ARI 1.0 on all workloads
  speedup_target: 40.0           # score cap = 2x the flashlib grid-DBSCAN reference geomean (~19.9x on H100, per-wl 7.7/17.3/15.6/31.4/28.6/33.9x, ARI 1.0 all 6): reference scores ~73/100, a solution must be 2x faster than it to max out. NB the O(N^2) baseline timing is thermally sensitive (an earlier run measured 13.3x), so the ratio carries some cross-run variance.
  base_seed: 20260701
  agent_workload_count: 6            # agent's submission feedback covers ALL graded workloads (no blind pass-3/fail-6 cliff); the params are agent-visible anyway
  expose_per_workload_metrics: true  # show per-workload pass/fail so the agent can fix the specific workload it regresses on
  # N in the 100k-170k band: the O(N^2) matmul baseline is seconds/call (grid kernel
  # wins 6-20x) but bounded for timed_iters; below ~100k the tensor-core matmul baseline
  # is faster than the grid kernel's fixed overhead. Vary N + density so agents can't
  # special-case. (H100 crossover sweep: 100k->6.0x, 150k->14.1x, 200k->27.0x.)
  workloads:
    - {id: w0, N: 100000, D: 2, n_centers: 12, eps: 1.5, min_samples: 8,  noise_frac: 0.03}
    - {id: w1, N: 110000, D: 2, n_centers: 16, eps: 1.3, min_samples: 10, noise_frac: 0.04}
    - {id: w2, N: 120000, D: 2, n_centers: 10, eps: 1.6, min_samples: 6,  noise_frac: 0.03}
    - {id: w3, N: 130000, D: 2, n_centers: 20, eps: 1.2, min_samples: 12, noise_frac: 0.05}
    - {id: w4, N: 150000, D: 2, n_centers: 14, eps: 1.4, min_samples: 8,  noise_frac: 0.04}
    - {id: w5, N: 170000, D: 2, n_centers: 18, eps: 1.5, min_samples: 8,  noise_frac: 0.03}
submission:
  kind: file
  path: /app/solution.patch

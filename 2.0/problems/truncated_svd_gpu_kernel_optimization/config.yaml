tag: systems
runtime:
  language: python
  timeout_seconds: 10800
  environment: "GPU Truncated SVD kernel optimization. The agent patches the tsvdlib package; the judge offloads timing to a Modal GPU, comparing the patched truncated_svd against a frozen naive baseline on hidden (N, D, k) workloads with a low-rank-factorization-quality gate (orthonormal components + captured energy)."
  apt_packages:
    - bash
    - ca-certificates
    - git
    - python3
    - python3-pip
  judge_apt_packages:
    - bash
    - ca-certificates
    - git
    - python3
    - python3-pip
  judge_pip_packages:
    - modal
  docker:
    # Experimental local images. Build with docker/build_images.sh before a local
    # Harbor trial. Both are light (ubuntu + modal + git); torch/triton/flashlib
    # run on the Modal GPU image defined in flash_gpu.py. The agent image bakes
    # /app/tsvdlib (git) + /opt/tsvd_ref + /opt/flash_gpu.py; the judge image
    # additionally bakes /opt/tsvdlib-clean.
    image: frontiercs/truncated-svd-gpu-kernel-optimization-agent:experimental-v0.2.0
    judge_image: frontiercs/truncated-svd-gpu-kernel-optimization-judge:experimental-v0.2.0
environment:
  cpus: 4
  memory_mb: 8192
  storage_mb: 16384
  build_timeout_seconds: 3600
evaluation:
  # --- primitive wiring (consumed by the generic evaluator + flash_gpu) ---
  primitive: tsvd
  pkg: tsvdlib
  ref_module: reftsvd
  clean_source: /opt/tsvdlib-clean
  baseline_source: /opt/tsvd_ref
  # --- Modal GPU ---
  gpu: "H100"                                        # Modal GPU spec (H100 / A100 / L40S)
  cuda_image: "nvidia/cuda:12.4.1-devel-ubuntu22.04"
  pip: ["torch", "numpy"]
  app_name: "tsvd-kernel-opt-eval"
  modal_timeout_seconds: 1800
  # --- timing + quality gate ---
  warmup_iters: 2
  timed_iters: 7
  captured_tolerance: 0.02       # agent captured energy must be >= (1-tol) x baseline on every iteration
  ortho_tolerance: 0.02          # max |V V^T - I_k| must stay within this tolerance
  speedup_target: 8.0            # calibrated: reference (flashlib-best) geomean ~8.7x on Modal H100
  base_seed: 20260701
  agent_workload_count: 3        # agent role runs a fast subset; final verifier runs them all
  expose_per_workload_metrics: false
  # --- hidden workloads (judge-only; config.yaml/task_config.json never enter the agent image) ---
  workloads:
    - {id: w0, N: 500000,  D: 128, k: 16}
    - {id: w1, N: 1000000, D: 256, k: 32}
    - {id: w2, N: 200000,  D: 512, k: 16}
    - {id: w3, N: 2000000, D: 64,  k: 8}
    - {id: w4, N: 300000,  D: 256, k: 16}
    - {id: w5, N: 800000,  D: 128, k: 32}
submission:
  kind: file
  path: /app/solution.patch

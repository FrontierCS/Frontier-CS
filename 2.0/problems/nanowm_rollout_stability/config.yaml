tag: systems
runtime:
  # Submission is a Python-only source patch (the real reference is
  # reference.patch). `language: python` keeps the file extension/CLI conventions
  # standard (mirrors vllm_llm_serving_optimization, #145); there is no separate
  # "patch" language in the framework.
  language: python
  timeout_seconds: 21600
  environment: >-
    Python-only patch against a clean NanoWM checkout (Nano World Models,
    arXiv:2605.23993); Modal GPU runs the NanoWM-L/2 CSGO 80-frame long-rollout;
    minimize long-horizon drift (tail-frame LPIPS) at iso-wall-clock
  apt_packages: [bash, ca-certificates, curl, git, python3, python3-pip]
  judge_apt_packages: [bash, ca-certificates, curl, git, python3, python3-pip]
  judge_pip_packages: [modal]
  docker:
    image: frontiercs/nanowm-rollout-stability-agent:experimental-v0
    judge_image: frontiercs/nanowm-rollout-stability-judge:experimental-v0
environment:
  cpus: 8
  memory_mb: 32768
  storage_mb: 32768
  build_timeout_seconds: 5400
evaluation:
  model: nanowm_l2_csgo
  dataset: game/csgo
  gpu: L40S
  # LONG rollout so error accumulates into a drifted tail; FIXED steps + a
  # wall-clock budget => the agent improves the rollout PROCEDURE at iso-compute
  # (stabilization / scheduling / drift-aware caching), not by adding steps.
  rollout_length: 80
  history_length: 4
  num_steps: 50            # fixed compute budget
  scheduling: sequential
  history_stab: 0.02       # baseline default (repo long_rollout setting)
  drift_tail_start: 60     # drift = mean LPIPS over frames >= this
  # Wall-clock guardrail: patched gen time may rise at most this over baseline,
  # else drift is being bought with compute (the speedup task's axis).
  wallclock_tolerance: 0.10
  # Drift reductions are small; enough clips to resolve above per-clip noise
  # (validated: stab=0.20 reference beats baseline at 22 clips, t~2.5, 73% win).
  quick_clips: 8
  final_clips: 24
  batch_size: 2
  baseline_cache_path: /opt/nanowm/baseline/stability_baseline.json
submission:
  kind: file
  path: /app/solution.patch
  max_queue_size: 2

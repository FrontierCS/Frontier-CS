schema_version = "1.1"

[task]
name = "bboplace/{task_id}"
authors = [{{ name = "LAMDA-BBO / BBOPlace-Bench", email = "noreply@example.com" }}]
keywords = ["bboplace", "chip-placement", "black-box-optimization", "{placer}", "{benchmark}"]

[metadata]
difficulty = "hard"
category = "optimization"
tags = ["bboplace-bench", "placement", "{placer}", "{benchmark}"]
bboplace_benchmark = "{benchmark}"
bboplace_placer = "{placer}"

[verifier]
timeout_sec = {timeout_sec}

[agent]
timeout_sec = {agent_timeout_sec}

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 16384
gpus = 0
allow_internet = true
